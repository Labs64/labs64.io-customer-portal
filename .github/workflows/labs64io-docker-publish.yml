name: Labs64.IO - Customer Portal - Publish Docker

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/customer-portal-ui
      context: ./customer-portal-fe
      mode: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  # Opens a PR in labs64.io-helm-charts pinning the digest into charts/customer-portal.
  propagate-to-chart:
    name: Pin digest in charts/customer-portal
    needs: publish
    uses: Labs64/labs64.io-workspace/.github/workflows/chart-update-dispatch.yml@master
    with:
      chart: customer-portal
      version: ${{ github.event.release.tag_name }}
      images: ${{ needs.publish.outputs.image-ref }}
    secrets:
      CHART_DISPATCH_TOKEN: ${{ secrets.CHART_DISPATCH_TOKEN }}
